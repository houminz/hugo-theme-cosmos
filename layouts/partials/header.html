<header class="header">
    <div class="container flex align-center justify-between">
        <label for="sidebar-control" class="sidebar-control" tabindex="0">
            <svg class="icon menu">
                <title>{{ i18n "button_nav_open" }}</title>
                <use href="#menu"></use>
            </svg>
            <svg class="icon arrow-left">
                <title>{{ i18n "button_nav_close" }}</title>
                <use href="#arrow-left"></use>
            </svg>
        </label>
        <div class="header-link">
            <div class="flex align-center">
                <a href="/">
                    <span class="brand-title">{{ .Site.Title }}</span>
                </a>
            </div>
        </div>
        <div class="menu-header">
            <div class="menu-header-items flex align-center">
            <span class="menu-header-home">
                <a href="{{ .Site.BaseURL }}">
                    <svg class="icon home">
                        <title>{{ i18n "button_homepage" }}</title>
                        <use href="#home"></use>
                    </svg>
                </a>
            </span>

            {{ range .Site.Menus.main }}
            {{ $name := .Name -}}
            {{ $title := printf "button_%s" .Title -}}
            {{ $url := urls.Parse .URL -}}
            <span class="menu-header-{{- $name -}}">
                <a href="{{- $url -}}">
                    <svg class="icon {{ $name -}}">
                        <title>{{ i18n $title }}</title>
                        <use href="#{{- $name -}}"></use>
                    </svg>
                </a>
            </span>
            {{ end }}

            <span class="menu-header-control">
                <label for="menu-header-control">
                <svg class="icon angle-right">
                    <use href="#angle-right"></use>
                    <title>{{ i18n "button_menu_close" }}</title>
                    </svg>
                </label>
            </span>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            {{ partial "search.html" }}
        </div>
        <label for="menu-header-control" class="menu-header-control">
            <svg class="icon angle-left">
                <use href="#angle-left"></use>
                <title>{{ i18n "button_menu_open" }}</title>
            </svg>
        </label>
    </div>
</header>
